[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mav-swiggy-simulator"
version = "1.0.0"
description = "Standalone local Swiggy Food MCP-shaped simulator for MAV"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.15.6"]

[project.scripts]
swiggy-sim-server = "swiggy_simulator.server:main"
swiggy-sim-check = "swiggy_simulator.check:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
